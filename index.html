<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบปฏิบัติการส่งสินค้า</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<style>
  :root{
    color-scheme: dark;
    --bg:#0b1620;
    --bg-2:#081019;
    --surface:#142230;
    --surface-2:#1a2c3c;
    --border:#26394a;
    --ink:#eef4f8;
    --ink-dim:#8ea0b2;

    --accent:#2f95e6;
    --accent-ink:#ffffff;
    --accent-soft:rgba(47,149,230,.16);
    --accent-2:#9a6bf0;

    --danger:#ef4a52;
    --danger-soft:rgba(239,74,82,.16);
    --warning:#f0a93a;
    --good:#34c77b;

    --flame-1:#ff8a3d;
    --flame-2:#f2402c;

    --chip-0:#17b6a4;
    --chip-1:#9a6bf0;
    --chip-2:#f0a93a;
    --chip-3:#3a9bf0;
    --chip-4:#f0538a;
    --chip-5:#4fd17c;

    --font-body:'Sarabun','Noto Sans Thai',system-ui,-apple-system,sans-serif;
    --font-mono:'JetBrains Mono','IBM Plex Mono',ui-monospace,SFMono-Regular,monospace;

    --shadow-xs:0 1px 2px rgba(0,0,0,.35);
    --shadow-sm:0 1px 2px rgba(0,0,0,.35),0 6px 16px -8px rgba(0,0,0,.55);
    --shadow-md:0 2px 6px rgba(0,0,0,.32),0 20px 36px -16px rgba(0,0,0,.6);
    --shadow-lg:0 14px 26px rgba(0,0,0,.4),0 40px 70px -24px rgba(0,0,0,.65);
    --radius:18px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1100px 480px at 50% -120px, rgba(47,149,230,.10), transparent 60%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
    background-attachment:fixed;
    color:var(--ink);
    font-family:var(--font-body);
    font-size:16px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
  }
  h1,h2,h3{text-wrap:balance; margin:0;}
  button{font-family:inherit;}
  input,select,textarea{font-family:inherit; font-size:.95rem;}
  .num{font-variant-numeric:tabular-nums;}

  .page{max-width:1100px;margin:0 auto;padding:18px 20px 80px;}

  /* ---------- header ---------- */
  .app-header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 2px 8px;}
  .btn-add-data{
    display:inline-flex;align-items:center;gap:9px;background:var(--accent);color:#fff;border:none;
    padding:9px 20px 9px 9px;border-radius:999px;font-weight:700;font-size:.92rem;cursor:pointer;
    box-shadow:0 10px 22px -10px rgba(47,149,230,.65);
    transition:transform .12s ease, box-shadow .15s ease, filter .15s ease;
  }
  .btn-add-data:hover{transform:translateY(-1px);filter:brightness(1.05);}
  .btn-add-data:active{transform:translateY(1px);}
  .add-icon-circle{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.24);display:flex;align-items:center;justify-content:center;font-size:1.15rem;line-height:1;flex:none;}
  .header-tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}

  .tool-icon-btn{
    width:36px;height:36px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
    background:var(--surface);border:1px solid var(--border);color:var(--ink-dim);cursor:pointer;flex:none;
    transition:background .15s ease,color .15s ease,transform .12s ease,border-color .15s ease;
  }
  .tool-icon-btn:hover{background:var(--surface-2);color:var(--ink);border-color:var(--accent);transform:translateY(-1px);}

  .storage-meter{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:6px 15px 6px 12px;}
  .storage-meter .meter-icon{color:var(--accent);display:flex;flex:none;}
  .storage-meter .meter-body{display:flex;flex-direction:column;gap:3px;min-width:130px;}
  .storage-meter .label{font-size:.62rem;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-dim);display:flex;justify-content:space-between;gap:6px;}
  .storage-meter .track{height:4px;border-radius:3px;background:var(--surface-2);overflow:hidden;}
  .storage-meter .fill{height:100%;background:var(--good);border-radius:3px;transition:width .3s ease;}
  .storage-meter.warn .fill{background:var(--warning);}
  .storage-meter.danger .fill{background:var(--danger);}

  .conn-badge{display:flex;align-items:center;gap:6px;font-size:.72rem;color:var(--ink-dim);padding:0 4px;}
  .conn-dot{width:8px;height:8px;border-radius:50%;background:var(--warning);flex:none;transition:background .2s ease;}
  .conn-dot.online{background:var(--good);}
  .conn-dot.error{background:var(--danger);}

  /* ---------- hero ---------- */
  .hero{text-align:center;padding:10px 0 30px;}
  .hero-graphic{position:relative;width:320px;max-width:86vw;margin:0 auto 6px;}
  .hero-truck{
    display:block;width:100%;height:auto;position:relative;z-index:1;
    filter:drop-shadow(0 14px 22px rgba(0,0,0,.45));
  }
  .hero h1{font-size:2rem;font-weight:700;letter-spacing:-.01em;color:var(--ink);margin-top:10px;}

  /* ---------- search / filters ---------- */
  .search-row{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:18px;}
  .pill-input{
    display:flex;align-items:center;gap:9px;background:var(--surface-2);border:1px solid var(--border);
    border-radius:999px;padding:11px 18px;color:var(--ink-dim);transition:border-color .15s ease;
  }
  .pill-input:focus-within{border-color:var(--accent);}
  .pill-input svg{flex:none;color:var(--ink-dim);}
  .pill-input input{background:transparent;border:none;outline:none;color:var(--ink);width:100%;font-size:.92rem;}
  .pill-input input::placeholder{color:var(--ink-dim);}
  .pill-search{flex:1 1 300px;max-width:420px;}
  .date-picker-wrap{position:relative;flex:0 0 auto;}
  .pill-date{
    flex:0 0 auto;min-width:200px;appearance:none;font:inherit;text-align:left;cursor:pointer;
  }
  .pill-date span{font-size:.92rem;color:var(--ink);white-space:nowrap;}
  .pill-date[aria-expanded="true"]{border-color:var(--accent);}
  .clear-link{background:none;border:none;color:var(--accent);font-size:.85rem;cursor:pointer;padding:8px 6px;white-space:nowrap;}
  .clear-link:hover{text-decoration:underline;}

  .date-popover{
    --ink:#1b2430; --ink-dim:#66748a; --surface-2:#eef1f5; --border:#e2e6ec;
    display:none;position:absolute;top:calc(100% + 8px);left:0;z-index:40;width:280px;
    background:#ffffff;border:1px solid var(--border);border-radius:14px;padding:14px;
    box-shadow:var(--shadow-lg);
  }
  .date-popover.open{display:block;}
  .dp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .dp-label{font-weight:700;font-size:.92rem;color:var(--ink);}
  .dp-nav{
    width:28px;height:28px;border-radius:50%;border:none;background:var(--surface-2);color:var(--ink-dim);
    cursor:pointer;font-size:1.05rem;display:flex;align-items:center;justify-content:center;
    transition:background .15s ease,color .15s ease;
  }
  .dp-nav:hover{background:var(--accent-soft);color:var(--accent);}
  .dp-weekdays{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:.68rem;color:var(--ink-dim);margin-bottom:4px;}
  .dp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
  .dp-day{
    aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:8px;border:none;
    background:transparent;color:var(--ink);font-size:.82rem;cursor:pointer;font-variant-numeric:tabular-nums;
    transition:background .12s ease,color .12s ease;
  }
  .dp-day:hover{background:var(--surface-2);}
  .dp-day.blank{visibility:hidden;pointer-events:none;}
  .dp-day.has-shipment{background:rgba(47,149,230,.18);color:#1968a8;font-weight:600;}
  .dp-day.has-shipment:hover{background:rgba(47,149,230,.3);}
  .dp-day.today{box-shadow:inset 0 0 0 1.5px var(--ink-dim);}
  .dp-day.selected{background:var(--accent) !important;color:#fff;font-weight:700;box-shadow:none;}
  .dp-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding-top:10px;border-top:1px solid var(--border);}
  .dp-legend{display:flex;align-items:center;gap:6px;font-size:.7rem;color:var(--ink-dim);}
  .dp-dot{width:9px;height:9px;border-radius:3px;background:rgba(47,149,230,.45);flex:none;}
  .dp-clear{background:none;border:none;color:var(--accent);font-size:.76rem;cursor:pointer;padding:2px;}
  .dp-clear:hover{text-decoration:underline;}

  .group-tabs{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-bottom:22px;}
  .group-pill{
    display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);
    border-radius:999px;padding:7px 18px 7px 7px;cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease, background .2s ease, border-color .2s ease;
  }
  .group-pill:hover{transform:translateY(-1px);}
  .group-pill[aria-pressed="true"]{
    background:linear-gradient(135deg, var(--flame-1), var(--flame-2));
    border-color:transparent; box-shadow:0 12px 24px -10px rgba(242,64,44,.55);
  }
  .pill-avatar{
    width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:.72rem;font-weight:700;color:#fff;flex:none;background:var(--surface-2);
  }
  .pill-avatar-all{background:var(--accent);}
  .pill-avatar-add{background:transparent;border:1.5px dashed var(--ink-dim);color:var(--ink-dim);font-size:1.05rem;}
  .pill-text{display:flex;flex-direction:column;line-height:1.22;text-align:left;}
  .pill-label{font-size:.78rem;color:var(--ink-dim);}
  .group-pill[aria-pressed="true"] .pill-label{color:rgba(255,255,255,.85);}
  .pill-count{font-size:1.05rem;font-weight:700;color:var(--ink);}
  .group-pill[aria-pressed="true"] .pill-count{color:#fff;}
  .add-pill{background:transparent;border-style:dashed;}

  .result-count{text-align:center;color:var(--ink-dim);font-size:.82rem;margin-bottom:14px;}

  /* ---------- record list ---------- */
  .record-list{display:flex;flex-direction:column;gap:16px;}
  .record{
    --ink:#1b2430; --ink-dim:#66748a; --surface-2:#eef1f5; --border:#e2e6ec;
    background:#ffffff;border:1px solid var(--border);border-radius:var(--radius);
    padding:16px 18px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:14px;
    transition:box-shadow .18s ease, transform .18s ease, border-color .18s ease;
  }
  .record:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);border-color:var(--accent);}

  .record-top-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .record-badges{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .badge-group{display:inline-flex;align-items:center;padding:5px 13px;border-radius:999px;font-size:.76rem;font-weight:700;color:#fff;}
  .badge-affiliation{display:inline-flex;align-items:center;padding:5px 13px;border-radius:999px;font-size:.76rem;font-weight:700;color:#fff;background:var(--flame-1);}
  .badge-plate{display:inline-flex;align-items:center;padding:5px 13px;border-radius:999px;font-size:.78rem;font-weight:600;font-family:var(--font-mono);background:var(--surface-2);border:1px solid var(--border);color:var(--ink);}
  .record-right{display:flex;align-items:center;gap:8px;}
  .badge-date{display:inline-flex;align-items:center;padding:5px 13px;border-radius:999px;font-size:.78rem;font-family:var(--font-mono);background:var(--surface-2);color:var(--ink-dim);}
  .icon-btn-circle{width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;border:none;cursor:pointer;flex:none;transition:background .15s ease, transform .12s ease;}
  .icon-btn-circle:hover{transform:translateY(-1px);}
  .icon-btn-circle.edit{background:var(--accent-soft);color:var(--accent);}
  .icon-btn-circle.edit:hover{background:rgba(47,149,230,.3);}
  .icon-btn-circle.delete{background:var(--danger-soft);color:var(--danger);}
  .icon-btn-circle.delete:hover{background:rgba(239,74,82,.3);}

  .record-info-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;background:var(--surface-2);border-radius:12px;padding:13px 15px;}
  .info-label{font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-dim);margin-bottom:5px;}
  .info-value{display:flex;align-items:flex-start;gap:8px;font-weight:600;color:var(--ink);font-size:.95rem;}
  .info-value svg{flex:none;margin-top:2px;color:var(--accent);}
  .info-value .muted{color:var(--ink-dim);font-weight:400;}
  .info-sub{display:block;font-size:.8rem;color:var(--ink-dim);font-weight:400;margin-top:2px;}

  .record-note{font-size:.85rem;color:var(--ink-dim);font-style:italic;}

  .record-images{display:flex;gap:10px;overflow-x:auto;padding-bottom:2px;}
  .record-images img{width:148px;height:106px;object-fit:cover;border-radius:12px;flex:none;cursor:pointer;border:1px solid var(--border);transition:transform .15s ease;display:block;}
  .record-images img:hover{transform:scale(1.03);}

  .empty-state{
    text-align:center;padding:56px 20px;color:var(--ink-dim);border:1px dashed var(--border);
    border-radius:var(--radius);background:var(--surface);
  }
  .empty-illustration{margin-bottom:14px;filter:drop-shadow(0 8px 14px rgba(0,0,0,.4));}

  /* ---------- modals ---------- */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(3,7,12,.65);display:none;align-items:flex-start;justify-content:center;
    padding:5vh 16px;overflow-y:auto;z-index:50;
  }
  .modal-overlay.open{display:flex;}
  .modal{
    position:relative;overflow:hidden;
    background:var(--surface);border-radius:16px;border:1px solid var(--border);width:100%;max-width:560px;
    padding:22px;box-shadow:var(--shadow-lg);
  }
  .modal::before{
    content:"";position:absolute;top:0;left:0;right:0;height:4px;
    background:linear-gradient(90deg, var(--accent), var(--accent-2));
  }
  .modal h2{font-size:1.15rem;margin-bottom:14px;}
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .form-grid .full{grid-column:1/-1;}
  .form-grid label{display:block;font-size:.78rem;color:var(--ink-dim);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em;}
  .form-grid input, .form-grid select, .form-grid textarea{
    width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--ink);
    border-radius:8px;padding:8px 10px;
  }
  .form-grid input:focus, .form-grid select:focus, .form-grid textarea:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .form-grid textarea{resize:vertical;min-height:60px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}

  .btn{
    appearance:none;border:1px solid var(--border);background:var(--surface);color:var(--ink);
    padding:9px 16px;border-radius:999px;font-size:.9rem;font-weight:500;cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
    transition:background .15s ease, border-color .15s ease, transform .12s ease;
  }
  .btn:hover{border-color:var(--ink-dim);transform:translateY(-1px);}
  .btn:active{transform:translateY(1px);}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-ghost{background:transparent;border-color:transparent;}
  .btn-ghost:hover{background:var(--surface-2);}

  .modal-form{padding-top:44px;}
  .modal-close-btn{
    position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:50%;border:none;
    background:var(--surface-2);color:var(--ink-dim);cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:background .15s ease,color .15s ease;
  }
  .modal-close-btn:hover{background:var(--danger-soft);color:var(--danger);}
  .modal-title-centered{
    display:flex;align-items:center;justify-content:center;gap:9px;text-align:center;
    font-size:1.2rem;margin-bottom:18px;color:var(--ink);
  }
  .modal-title-icon{color:var(--accent);display:flex;flex:none;}

  .group-toggle-row{display:flex;gap:10px;flex-wrap:wrap;}
  .group-toggle-btn{
    flex:1 1 160px;display:flex;align-items:center;gap:10px;
    border:1.5px solid var(--border);background:var(--surface-2);color:var(--ink-dim);
    border-radius:12px;padding:10px 14px;cursor:pointer;font-weight:600;font-size:.88rem;text-align:left;
    transition:border-color .15s ease, background .15s ease, color .15s ease;
  }
  .group-toggle-btn .toggle-avatar{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;flex:none;}
  .group-toggle-btn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--ink);}

  .btn-submit-wide{
    width:100%;display:flex;align-items:center;justify-content:center;gap:9px;
    background:linear-gradient(90deg, var(--accent), #1f6fb8);color:#fff;border:none;
    padding:13px;border-radius:12px;font-weight:700;font-size:.95rem;cursor:pointer;
    box-shadow:0 12px 26px -12px rgba(47,149,230,.6);
    transition:transform .12s ease, filter .15s ease;
  }
  .btn-submit-wide:hover{transform:translateY(-1px);filter:brightness(1.06);}
  .btn-submit-wide:active{transform:translateY(1px);}
  .btn-submit-wide[disabled]{opacity:.6;cursor:not-allowed;transform:none;}

  .field-hint{font-size:.72rem;color:var(--ink-dim);margin-top:6px;}
  .field-hint.warn{color:var(--warning);}

  .dropzone{
    border:2px dashed var(--border);border-radius:12px;padding:18px;text-align:center;color:var(--ink-dim);
    cursor:pointer;font-size:.85rem;background:var(--surface-2);transition:border-color .15s ease;
  }
  .dropzone:hover{border-color:var(--accent);}
  .dropzone.drag{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);}
  .preview-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
  .preview-item{position:relative;width:64px;height:64px;border-radius:8px;overflow:hidden;border:1px solid var(--border);}
  .preview-item img{width:100%;height:100%;object-fit:cover;display:block;}
  .preview-item button{
    position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;border:none;
    background:rgba(0,0,0,.7);color:#fff;font-size:.68rem;line-height:1;cursor:pointer;padding:0;
  }

  .groups-manage-list{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;max-height:280px;overflow-y:auto;}
  .group-row{display:flex;align-items:center;gap:8px;}
  .group-row input[type="text"]{flex:1;background:var(--surface-2);border:1px solid var(--border);color:var(--ink);border-radius:8px;padding:8px 10px;}
  .group-row .count{font-size:.75rem;color:var(--ink-dim);font-family:var(--font-mono);min-width:64px;text-align:right;}
  .add-group-row{display:flex;gap:8px;border-top:1px dashed var(--border);padding-top:12px;}
  .add-group-row input{flex:1;background:var(--surface-2);border:1px solid var(--border);color:var(--ink);border-radius:8px;padding:8px 10px;}

  .lightbox{background:rgba(2,5,9,.9);}
  .lightbox .lb-inner{position:relative;max-width:92vw;max-height:88vh;display:flex;align-items:center;justify-content:center;}
  .lightbox img{max-width:92vw;max-height:88vh;object-fit:contain;border-radius:6px;}
  .lb-btn{
    position:fixed;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.12);color:#fff;border:none;
    width:44px;height:44px;border-radius:50%;font-size:1.3rem;cursor:pointer;
  }
  .lb-prev{left:16px;} .lb-next{right:16px;}
  .lb-close{position:fixed;top:16px;right:16px;background:rgba(255,255,255,.12);color:#fff;border:none;width:40px;height:40px;border-radius:50%;font-size:1.1rem;cursor:pointer;}
  .lb-count{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);color:#fff;font-family:var(--font-mono);font-size:.8rem;opacity:.8;}

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);
    padding:10px 18px;border-radius:999px;font-size:.85rem;box-shadow:var(--shadow-sm);z-index:100;
  }
  .toast.error{background:var(--danger);color:#fff;}

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function normalize(s){ return String(s||'').toLowerCase().replace(/[\s\-\.]/g,''); }

  function formatThaiDate(iso){
    if(!iso) return '';
    var parts = iso.split('-');
    var y = Number(parts[0]), m = Number(parts[1]), d = Number(parts[2]);
    if(!y||!m||!d) return iso;
    return d + ' ' + THAI_MONTHS[m-1] + ' ' + (y+543);
  }

  function todayISO(){
    var d = new Date();
    var m = String(d.getMonth()+1).padStart(2,'0');
    var day = String(d.getDate()).padStart(2,'0');
    return d.getFullYear() + '-' + m + '-' + day;
  }

  function pad2(n){ return n < 10 ? '0' + n : '' + n; }
  function isoFromYMD(y,m,d){ return y + '-' + pad2(m) + '-' + pad2(d); }
  function chunk(arr, size){ var out=[]; for(var i=0;i<arr.length;i+=size) out.push(arr.slice(i,i+size)); return out; }

  /* ---------------- connection status ---------------- */
  function setConnStatus(state, text){
    var dot = $('#conn-dot'); var t = $('#conn-text');
    dot.classList.remove('online','error');
    if(state) dot.classList.add(state);
    t.textContent = text;
  }

  function renderCalendarGrid(){
    var y = calView.y, m = calView.m;
    $('#dp-label').textContent = THAI_MONTHS[m-1] + ' ' + (y + 543);
    var firstDow = new Date(y, m-1, 1).getDay();
    var daysInMonth = new Date(y, m, 0).getDate();
    var shipDates = getShipmentDateSet();
    var todayIso = todayISO();
    var html = '';
    for(var i=0;i<firstDow;i++){ html += '<button type="button" class="dp-day blank" tabindex="-1"></button>'; }
    for(var d=1; d<=daysInMonth; d++){
      var iso = isoFromYMD(y, m, d);
      var cls = 'dp-day';
      if(shipDates[iso]) cls += ' has-shipment';
      if(iso === todayIso) cls += ' today';
      if(iso === filters.date) cls += ' selected';
      html += '<button type="button" class="' + cls + '" data-iso="' + iso + '">' + d + '</button>';
    }
    $('#dp-grid').innerHTML = html;
  }

  /* ---------------- storage meter (informational, Firestore ~1GB free tier) ---------------- */
  function refreshStorageMeter(){
    var bytes = new Blob([JSON.stringify(STATE)]).size;
    var mb = bytes / (1024*1024);
    var pct = Math.min(100, (bytes / MAX_TOTAL_BYTES) * 100);
    $('#storage-text').textContent = mb.toFixed(2) + ' MB / ~1 GB';
    $('#storage-fill').style.width = Math.max(pct, 1.2) + '%';
    var meter = $('#storage-meter');
    meter.classList.remove('warn','danger');
    if(pct > 85) meter.classList.add('danger');
    else if(pct > 60) meter.classList.add('warn');
  }

  function estimateRecordBytes(images){
    var base = 2000;
    var imgBytes = images.reduce(function(sum, s){ return sum + s.length; }, 0);
    return base + imgBytes;
  }

  function updateImageSizeHint(){
    var bytes = estimateRecordBytes(pendingImages);
    var hint = $('#image-size-hint');
    var kb = Math.round(bytes/1024);
    hint.textContent = 'ขนาดข้อมูลรูปภาพของรายการนี้: ~' + kb + ' KB (จำกัดไม่เกิน ~' + Math.round(MAX_RECORD_BYTES/1024) + ' KB ต่อ 1 รายการ)';
    hint.classList.toggle('warn', bytes > MAX_RECORD_BYTES * 0.8);
  }

  function getFiltered(){
    return STATE.records.filter(function(r){
      if(filters.group !== 'all' && r.groupId !== filters.group) return false;
      if(filters.q){
        var needle = normalize(filters.q);
        var hay = normalize(r.name + ' ' + r.plate + ' ' + (r.address||'') + ' ' + (r.district||'') + ' ' + (r.province||''));
        if(hay.indexOf(needle) === -1) return false;
      }
      if(filters.date){
        if(r.date !== filters.date) return false;
      }
      return true;
    }).sort(function(a,b){
      if(a.date !== b.date) return a.date < b.date ? 1 : -1;
      return (b.createdAt||0) - (a.createdAt||0);
    });
  }

  /* ---------------- Firestore realtime sync ---------------- */
  function initSync(){
    setConnStatus(null, 'กำลังเชื่อมต่อ...');

    db.collection('groups').onSnapshot(function(snap){
      setConnStatus('online', 'เชื่อมต่อแล้ว');
      if(snap.empty && !groupsSeeded){
        groupsSeeded = true;
        // Fixed doc IDs + merge:true make this idempotent: even if two tabs/devices
        // race to seed at the same time, they both write the same two documents
        // instead of creating duplicates.
        db.collection('groups').doc('g-chinese').set({ name:'ลูกค้าจีน', hue:0 }, { merge:true });
        db.collection('groups').doc('g-foreign').set({ name:'ลูกค้าต่างประเทศ', hue:3 }, { merge:true });
        return;
      }
      STATE.groups = snap.docs.map(function(d){ return Object.assign({ id: d.id }, d.data()); });
      render();
      if($('#modal-groups').classList.contains('open')) renderGroupsManage();
    }, function(err){
      setConnStatus('error', 'เชื่อมต่อไม่สำเร็จ');
      showToast('เชื่อมต่อฐานข้อมูลกลุ่มไม่สำเร็จ: ' + err.message, true);
    });

    db.collection('records').onSnapshot(function(snap){
      setConnStatus('online', 'เชื่อมต่อแล้ว');
      STATE.records = snap.docs.map(function(d){ return Object.assign({ id: d.id }, d.data()); });
      render();
    }, function(err){
      setConnStatus('error', 'เชื่อมต่อไม่สำเร็จ');
      showToast('เชื่อมต่อฐานข้อมูลรายการไม่สำเร็จ: ' + err.message, true);
    });
  }

  function compressImage(file, maxDim, quality){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(e){
        var img = new Image();
        img.onload = function(){
          var w = img.width, h = img.height;
          if(w > h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
          else if(h >= w && h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
          var canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function handleFiles(fileList){
    var files = Array.prototype.slice.call(fileList).filter(function(f){ return f.type.indexOf('image/') === 0; });
    if(!files.length) return;
    Promise.all(files.map(function(f){ return compressImage(f, 900, 0.68); }))
      .then(function(results){
        var acc = pendingImages.slice();
        var accBytes = estimateRecordBytes(acc);
        var skipped = 0;
        for(var i=0;i<results.length;i++){
          var next = accBytes + results[i].length;
          if(next > MAX_RECORD_BYTES){ skipped = results.length - i; break; }
          acc.push(results[i]); accBytes = next;
        }
        pendingImages = acc;
        renderPreviewGrid();
        if(skipped > 0){
          showToast('เพิ่มรูปได้บางส่วน เนื่องจากข้อมูลของรายการนี้ใกล้เต็มขีดจำกัด (~' + Math.round(MAX_RECORD_BYTES/1024) + ' KB) กรุณาลดจำนวนรูปหรือถ่ายรูปให้ไฟล์เล็กลง', true);
        }
      })
      .catch(function(){ showToast('ไม่สามารถอ่านไฟล์รูปภาพบางไฟล์ได้', true); });
  }

  function saveRecordForm(e){
    e.preventDefault();
    var groupId = $('#rf-group').value;
    var name = $('#rf-name').value.trim();
    var plate = $('#rf-plate').value.trim();
    var date = $('#rf-date').value;
    var affiliation = $('#rf-affiliation').value.trim();
    var address = $('#rf-address').value.trim();
    var district = $('#rf-district').value.trim();
    var province = $('#rf-province').value.trim();
    if(!groupId){ showToast('กรุณาเลือกกลุ่มลูกค้า', true); return; }
    if(!name || !plate || !date){ showToast('กรุณากรอกชื่อ ทะเบียน และวันที่ให้ครบ', true); return; }

    var payload = {
      groupId: groupId, name: name, plate: plate, date: date,
      affiliation: affiliation, address: address, district: district, province: province,
      images: pendingImages.slice(), updatedAt: Date.now()
    };

    var btn = $('#btn-submit-record'); btn.disabled = true;
    showToast('กำลังบันทึก...');
    var promise;
    if(modalMode === 'edit' && editingId){
      promise = db.collection('records').doc(editingId).set(payload, { merge: true });
    } else {
      payload.createdAt = Date.now();
      promise = db.collection('records').add(payload);
    }
    promise.then(function(){
      showToast('บันทึกแล้ว');
    }).catch(function(err){
      showToast('บันทึกไม่สำเร็จ: ' + err.message, true);
    }).then(function(){
      btn.disabled = false;
    });
    closeModal('modal-record');
  }

  /* ---------------- export / import ---------------- */
  function triggerDownload(filename, text){
    var blob = new Blob([text], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }

  function exportData(){
    var data = JSON.stringify(STATE, null, 2);
    triggerDownload('delivery-records-backup-' + todayISO() + '.json', data);
    showToast('ดาวน์โหลดไฟล์สำรองแล้ว');
  }

  function importData(file){
    var reader = new FileReader();
    reader.onload = function(e){
      var parsed;
      try{ parsed = JSON.parse(e.target.result); }
      catch(err){ showToast('ไฟล์ไม่ถูกต้อง ไม่สามารถนำเข้าได้', true); return; }
      if(!parsed || !Array.isArray(parsed.groups) || !Array.isArray(parsed.records)){
        showToast('รูปแบบไฟล์ไม่ถูกต้อง', true); return;
      }
      if(!confirm('นำเข้าข้อมูล ' + parsed.records.length + ' รายการ และ ' + parsed.groups.length + ' กลุ่ม จากไฟล์สำรอง เข้าสู่ระบบหรือไม่? (ข้อมูลเดิมที่มีอยู่จะยังอยู่ครบ ไม่ถูกลบ)')) return;

      showToast('กำลังนำเข้าข้อมูล...');
      var ops = [];
      parsed.groups.forEach(function(g){
        var data = Object.assign({}, g); var id = data.id; delete data.id;
        ops.push({ col:'groups', id: id, data: data });
      });
      parsed.records.forEach(function(r){
        var data = Object.assign({}, r); var id = data.id; delete data.id;
        ops.push({ col:'records', id: id, data: data });
      });

      var groups = chunk(ops, 400);
      var chain = Promise.resolve();
      groups.forEach(function(group){
        chain = chain.then(function(){
          var batch = db.batch();
          group.forEach(function(op){
            var ref = op.id ? db.collection(op.col).doc(op.id) : db.collection(op.col).doc();
            batch.set(ref, op.data, { merge: true });
          });
          return batch.commit();
        });
      });
      chain.then(function(){ showToast('นำเข้าข้อมูลสำเร็จ'); })
        .catch(function(err){ showToast('นำเข้าไม่สำเร็จ: ' + err.message, true); });
    };
    reader.readAsText(file);
  }

  /* ---------------- events ---------------- */
  function bindEvents(){
    $('#btn-add').addEventListener('click', openAddModal);
    $all('[data-close]').forEach(function(btn){
      btn.addEventListener('click', function(){ closeModal(btn.getAttribute('data-close')); });
    });
    $all('.modal-overlay').forEach(function(overlay){
      overlay.addEventListener('click', function(e){ if(e.target === overlay) overlay.classList.remove('open'); });
    });
    document.addEventListener('keydown', function(e){
      if(e.key !== 'Escape') return;
      if($('#modal-lightbox').classList.contains('open')) closeModal('modal-lightbox');
      else if($('#modal-record').classList.contains('open')) closeModal('modal-record');
      else if($('#modal-groups').classList.contains('open')) closeModal('modal-groups');
      else if($('#date-popover').classList.contains('open')) closeDatePopover();
    });

    $('#record-form').addEventListener('submit', saveRecordForm);

    $('#dropzone').addEventListener('click', function(){ $('#rf-images').click(); });
    $('#rf-images').addEventListener('change', function(e){ handleFiles(e.target.files); e.target.value=''; });
    $('#dropzone').addEventListener('dragover', function(e){ e.preventDefault(); $('#dropzone').classList.add('drag'); });
    $('#dropzone').addEventListener('dragleave', function(){ $('#dropzone').classList.remove('drag'); });
    $('#dropzone').addEventListener('drop', function(e){
      e.preventDefault(); $('#dropzone').classList.remove('drag');
      handleFiles(e.dataTransfer.files);
    });
    $('#preview-grid').addEventListener('click', function(e){
      var btn = e.target.closest('[data-remove-img]');
      if(!btn) return;
      pendingImages.splice(Number(btn.getAttribute('data-remove-img')), 1);
      renderPreviewGrid();
    });

    $('#rf-group-toggle').addEventListener('click', function(e){
      var btn = e.target.closest('.group-toggle-btn');
      if(!btn) return;
      renderGroupToggle(btn.getAttribute('data-group'));
    });

    $('#record-list').addEventListener('click', function(e){
      var editBtn = e.target.closest('[data-action="edit"]');
      var delBtn = e.target.closest('[data-action="delete"]');
      var imgEl = e.target.closest('[data-action="view-images"]');
      if(editBtn) openEditModal(editBtn.getAttribute('data-id'));
      else if(delBtn) deleteRecord(delBtn.getAttribute('data-id'));
      else if(imgEl){
        var r = STATE.records.find(function(x){ return x.id === imgEl.getAttribute('data-id'); });
        if(r && r.images && r.images.length) openLightbox(r.images, Number(imgEl.getAttribute('data-index'))||0);
      }
    });

    $('#group-tabs').addEventListener('click', function(e){
      var addBtn = e.target.closest('#tab-add-group');
      var pill = e.target.closest('.group-pill[data-group]');
      if(addBtn){ renderGroupsManage(); openModal('modal-groups'); return; }
      if(pill){ filters.group = pill.getAttribute('data-group'); render(); }
    });

    $('#btn-groups').addEventListener('click', function(){ renderGroupsManage(); openModal('modal-groups'); });
    $('#btn-add-group').addEventListener('click', addGroup);
    $('#groups-manage-list').addEventListener('change', function(e){
      var input = e.target.closest('[data-rename]');
      if(input) renameGroup(input.getAttribute('data-rename'), input.value);
    });
    $('#groups-manage-list').addEventListener('click', function(e){
      var btn = e.target.closest('[data-delete-group]');
      if(btn && !btn.disabled) deleteGroup(btn.getAttribute('data-delete-group'));
    });

    $('#f-search').addEventListener('input', function(e){ filters.q = e.target.value; render(); });

    $('#f-date-btn').addEventListener('click', function(e){ e.stopPropagation(); toggleDatePopover(); });
    $('#dp-prev').addEventListener('click', function(){
      calView.m--; if(calView.m < 1){ calView.m = 12; calView.y--; }
      renderCalendarGrid();
    });
    $('#dp-next').addEventListener('click', function(){
      calView.m++; if(calView.m > 12){ calView.m = 1; calView.y++; }
      renderCalendarGrid();
    });
    $('#dp-grid').addEventListener('click', function(e){
      var btn = e.target.closest('.dp-day:not(.blank)');
      if(!btn) return;
      filters.date = btn.getAttribute('data-iso');
      updateDateLabel();
      closeDatePopover();
      render();
    });
    $('#dp-clear-date').addEventListener('click', function(){
      filters.date = '';
      updateDateLabel();
      renderCalendarGrid();
      render();
    });
    document.addEventListener('click', function(e){
      if(!$('#date-popover').classList.contains('open')) return;
      if(e.target.closest('#date-popover') || e.target.closest('#f-date-btn')) return;
      closeDatePopover();
    });

    $('#btn-clear').addEventListener('click', function(){
      filters = { group:'all', q:'', date:'' };
      $('#f-search').value='';
      updateDateLabel();
      closeDatePopover();
      render();
    });

    $('#lb-close').addEventListener('click', function(){ closeModal('modal-lightbox'); });
    $('#lb-prev').addEventListener('click', function(){ lightboxStep(-1); });
    $('#lb-next').addEventListener('click', function(){ lightboxStep(1); });
    document.addEventListener('keydown', function(e){
      if(!$('#modal-lightbox').classList.contains('open')) return;
      if(e.key === 'ArrowLeft') lightboxStep(-1);
      else if(e.key === 'ArrowRight') lightboxStep(1);
    });

    $('#btn-export').addEventListener('click', exportData);
    $('#btn-import').addEventListener('click', function(){ $('#import-file').click(); });
    $('#import-file').addEventListener('change', function(e){
      if(e.target.files[0]) importData(e.target.files[0]);
      e.target.value = '';
    });
  }

  bindEvents();
  render();
  initSync();
})();
</script>
</body>
</html>
