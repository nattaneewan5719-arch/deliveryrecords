<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบปฏิบัติการส่งสินค้า (ดูอย่างเดียว)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<style>
  :root{
    color-scheme: dark;
    --bg:#0b1620;
    --bg-2:#081019;
    --surface:#142230;
    --surface-2:#1a2c3c;
    --border:#26394a;
    --ink:#eef4f8;
    --ink-dim:#8ea0b2;

    --accent:#2f95e6;
    --accent-ink:#ffffff;
    --accent-soft:rgba(47,149,230,.16);
    --accent-2:#9a6bf0;

    --danger:#ef4a52;
    --danger-soft:rgba(239,74,82,.16);
    --warning:#f0a93a;
    --good:#34c77b;

    --flame-1:#ff8a3d;
    --flame-2:#f2402c;

    --chip-0:#17b6a4;
    --chip-1:#9a6bf0;
    --chip-2:#f0a93a;
    --chip-3:#3a9bf0;
    --chip-4:#f0538a;
    --chip-5:#4fd17c;

    --font-body:'Sarabun','Noto Sans Thai',system-ui,-apple-system,sans-serif;
    --font-mono:'JetBrains Mono','IBM Plex Mono',ui-monospace,SFMono-Regular,monospace;

    --shadow-xs:0 1px 2px rgba(0,0,0,.35);
    --shadow-sm:0 1px 2px rgba(0,0,0,.35),0 6px 16px -8px rgba(0,0,0,.55);
    --shadow-md:0 2px 6px rgba(0,0,0,.32),0 20px 36px -16px rgba(0,0,0,.6);
    --shadow-lg:0 14px 26px rgba(0,0,0,.4),0 40px 70px -24px rgba(0,0,0,.65);
    --radius:18px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1100px 480px at 50% -120px, rgba(47,149,230,.10), transparent 60%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
    background-attachment:fixed;
    color:var(--ink);
    font-family:var(--font-body);
    font-size:16px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
  }
  h1,h2,h3{text-wrap:balance; margin:0;}
  button{font-family:inherit;}
  input,select,textarea{font-family:inherit; font-size:.95rem;}
  .num{font-variant-numeric:tabular-nums;}

  .page{max-width:1100px;margin:0 auto;padding:18px 20px 80px;}

  /* ---------- header ---------- */
  .app-header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 2px 8px;}
  .header-tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}

  .view-badge{
    display:inline-flex;align-items:center;gap:7px;background:var(--accent-soft);color:var(--accent);
    border:1px solid rgba(47,149,230,.35);border-radius:999px;padding:8px 16px 8px 12px;
    font-weight:700;font-size:.85rem;
  }

  .tool-icon-btn{
    width:36px;height:36px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
    background:var(--surface);border:1px solid var(--border);color:var(--ink-dim);cursor:pointer;flex:none;
    transition:background .15s ease,color .15s ease,transform .12s ease,border-color .15s ease;
  }
  .tool-icon-btn:hover{background:var(--surface-2);color:var(--ink);border-color:var(--accent);transform:translateY(-1px);}

  .storage-meter{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:6px 15px 6px 12px;}
  .storage-meter .meter-icon{color:var(--accent);display:flex;flex:none;}
  .storage-meter .meter-body{display:flex;flex-direction:column;gap:3px;min-width:130px;}
  .storage-meter .label{font-size:.62rem;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-dim);display:flex;justify-content:space-between;gap:6px;}
  .storage-meter .track{height:4px;border-radius:3px;background:var(--surface-2);overflow:hidden;}
  .storage-meter .fill{height:100%;background:var(--good);border-radius:3px;transition:width .3s ease;}
  .storage-meter.warn .fill{background:var(--warning);}
  .storage-meter.danger .fill{background:var(--danger);}

  .conn-badge{display:flex;align-items:center;gap:6px;font-size:.72rem;color:var(--ink-dim);padding:0 4px;}
  .conn-dot{width:8px;height:8px;border-radius:50%;background:var(--warning);flex:none;transition:background .2s ease;}
  .conn-dot.online{background:var(--good);}
  .conn-dot.error{background:var(--danger);}

  /* ---------- hero ---------- */
  .hero{text-align:center;padding:10px 0 30px;}
  .hero-graphic{position:relative;width:320px;max-width:86vw;margin:0 auto 6px;}
  .hero-truck{
    display:block;width:100%;height:auto;position:relative;z-index:1;
    filter:drop-shadow(0 14px 22px rgba(0,0,0,.45));
  }
  .hero h1{font-size:2rem;font-weight:700;letter-spacing:-.01em;color:var(--ink);margin-top:10px;}

  /* ---------- search / filters ---------- */
  .search-row{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:18px;}
  .pill-input{
    display:flex;align-items:center;gap:9px;background:var(--surface-2);border:1px solid var(--border);
    border-radius:999px;padding:11px 18px;color:var(--ink-dim);transition:border-color .15s ease;
  }
  .pill-input:focus-within{border-color:var(--accent);}
  .pill-input svg{flex:none;color:var(--ink-dim);}
  .pill-input input{background:transparent;border:none;outline:none;color:var(--ink);width:100%;font-size:.92rem;}
  .pill-input input::placeholder{color:var(--ink-dim);}
  .pill-search{flex:1 1 300px;max-width:420px;}
  .date-picker-wrap{position:relative;flex:0 0 auto;}
  .pill-date{
    flex:0 0 auto;min-width:200px;appearance:none;font:inherit;text-align:left;cursor:pointer;
  }
  .pill-date span{font-size:.92rem;color:var(--ink);white-space:nowrap;}
  .pill-date[aria-expanded="true"]{border-color:var(--accent);}
  .clear-link{background:none;border:none;color:var(--accent);font-size:.85rem;cursor:pointer;padding:8px 6px;white-space:nowrap;}
  .clear-link:hover{text-decoration:underline;}

  .date-popover{
    --ink:#1b2430; --ink-dim:#66748a; --surface-2:#eef1f5; --border:#e2e6ec;
    display:none;position:absolute;top:calc(100% + 8px);left:0;z-index:40;width:280px;
    background:#ffffff;border:1px solid var(--border);border-radius:14px;padding:14px;
    box-shadow:var(--shadow-lg);
  }
  .date-popover.open{display:block;}
  .dp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .dp-label{font-weight:700;font-size:.92rem;color:var(--ink);}
  .dp-nav{
    width:28px;height:28px;border-radius:50%;border:none;background:var(--surface-2);color:var(--ink-dim);
    cursor:pointer;font-size:1.05rem;display:flex;align-items:center;justify-content:center;
    transition:background .15s ease,color .15s ease;
  }
  .dp-nav:hover{background:var(--accent-soft);color:var(--accent);}
  .dp-weekdays{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:.68rem;color:var(--ink-dim);margin-bottom:4px;}
  .dp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
  .dp-day{
    aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:8px;border:none;
    background:transparent;color:var(--ink);font-size:.82rem;cursor:pointer;font-variant-numeric:tabular-nums;
    transition:background .12s ease,color .12s ease;
  }
  .dp-day:hover{background:var(--surface-2);}
  .dp-day.blank{visibility:hidden;pointer-events:none;}
  .dp-day.has-shipment{background:rgba(47,149,230,.18);color:#1968a8;font-weight:600;}
  .dp-day.has-shipment:hover{background:rgba(47,149,230,.3);}
  .dp-day.today{box-shadow:inset 0 0 0 1.5px var(--ink-dim);}
  .dp-day.selected{background:var(--accent) !important;color:#fff;font-weight:700;box-shadow:none;}
  .dp-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding-top:10px;border-top:1px solid var(--border);}
  .dp-legend{display:flex;align-items:center;gap:6px;font-size:.7rem;color:var(--ink-dim);}
  .dp-dot{width:9px;height:9px;border-radius:3px;background:rgba(47,149,230,.45);flex:none;}
  .dp-clear{background:none;border:none;color:var(--accent);font-size:.76rem;cursor:pointer;padding:2px;}
  .dp-clear:hover{text-decoration:underline;}

  .group-tabs{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-bottom:22px;}

  .country-tabs{display:none;justify-content:center;gap:8px;flex-wrap:wrap;margin:-10px auto 22px;max-width:900px;}
  .country-pill{
    display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);
    border-radius:999px;padding:6px 13px;cursor:pointer;font-size:.82rem;color:var(--ink-dim);
    transition:transform .12s ease, background .15s ease, border-color .15s ease, color .15s ease;
  }
  .country-pill:hover{transform:translateY(-1px);border-color:var(--accent);}
  .country-pill .flag{font-size:1.05rem;line-height:1;}
  .country-pill .cnt{font-family:var(--font-mono);font-size:.72rem;color:var(--ink-dim);}
  .country-pill[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;}
  .country-pill[aria-pressed="true"] .cnt{color:rgba(255,255,255,.85);}

  .badge-country{
    display:inline-flex;align-items:center;gap:5px;padding:5px 13px;border-radius:999px;font-size:.76rem;
    font-weight:600;background:var(--surface-2);border:1px solid var(--border);color:var(--ink);
  }

  .group-pill{
    display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);
    border-radius:999px;padding:7px 18px 7px 7px;cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease, background .2s ease, border-color .2s ease;
  }
  .group-pill:hover{transform:translateY(-1px);}
  .group-pill[aria-pressed="true"]{
    background:linear-gradient(135deg, var(--flame-1), var(--flame-2));
    border-color:transparent; box-shadow:0 12px 24px -10px rgba(242,64,44,.55);
  }
  .pill-avatar{
    width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:.72rem;font-weight:700;color:#fff;flex:none;background:var(--surface-2);
  }
  .pill-avatar-all{background:var(--accent);}
  .pill-text{display:flex;flex-direction:column;line-height:1.22;text-align:left;}
  .pill-label{font-size:.78rem;color:var(--ink-dim);}
  .group-pill[aria-pressed="true"] .pill-label{color:rgba(255,255,255,.85);}
  .pill-count{font-size:1.05rem;font-weight:700;color:var(--ink);}
  .group-pill[aria-pressed="true"] .pill-count{color:#fff;}

  .result-count{text-align:center;color:var(--ink-dim);font-size:.82rem;margin-bottom:14px;}

  /* ---------- record list ---------- */
  .record-list{display:flex;flex-direction:column;gap:16px;}
  .record{
    --ink:#1b2430; --ink-dim:#66748a; --surface-2:#eef1f5; --border:#e2e6ec;
    background:#ffffff;border:1px solid var(--border);border-radius:var(--radius);
    padding:16px 18px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:14px;
    transition:box-shadow .18s ease, transform .18s ease, border-color .18s ease;
  }
  .record:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);border-color:var(--accent);}

  .record-top-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .record-badges{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .badge-group{display:inline-flex;align-items:center;padding:5px 13px;border-radius:999px;font-size:.76rem;font-weight:700;color:#fff;}
  .badge-affiliation{display:inline-flex;align-items:center;padding:5px 13px;border-radius:999px;font-size:.76rem;font-weight:700;color:#fff;background:var(--flame-1);}
  .badge-plate{display:inline-flex;align-items:center;padding:5px 13px;border-radius:999px;font-size:.78rem;font-weight:600;font-family:var(--font-mono);background:var(--surface-2);border:1px solid var(--border);color:var(--ink);}
  .record-right{display:flex;align-items:center;gap:8px;}
  .badge-date{display:inline-flex;align-items:center;padding:5px 13px;border-radius:999px;font-size:.78rem;font-family:var(--font-mono);background:var(--surface-2);color:var(--ink-dim);}

  .record-info-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;background:var(--surface-2);border-radius:12px;padding:13px 15px;}
  .info-label{font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-dim);margin-bottom:5px;}
  .info-value{display:flex;align-items:flex-start;gap:8px;font-weight:600;color:var(--ink);font-size:.95rem;}
  .info-value svg{flex:none;margin-top:2px;color:var(--accent);}
  .info-value .muted{color:var(--ink-dim);font-weight:400;}
  .info-sub{display:block;font-size:.8rem;color:var(--ink-dim);font-weight:400;margin-top:2px;}

  .record-note{font-size:.85rem;color:var(--ink-dim);font-style:italic;}

  .record-images{display:flex;gap:10px;overflow-x:auto;padding-bottom:2px;}
  .record-images img{width:148px;height:106px;object-fit:cover;border-radius:12px;flex:none;cursor:pointer;border:1px solid var(--border);transition:transform .15s ease;display:block;}
  .record-images img:hover{transform:scale(1.03);}

  .empty-state{
    text-align:center;padding:56px 20px;color:var(--ink-dim);border:1px dashed var(--border);
    border-radius:var(--radius);background:var(--surface);
  }
  .empty-illustration{margin-bottom:14px;filter:drop-shadow(0 8px 14px rgba(0,0,0,.4));}

  /* ---------- lightbox ---------- */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(3,7,12,.65);display:none;align-items:flex-start;justify-content:center;
    padding:5vh 16px;overflow-y:auto;z-index:50;
  }
  .modal-overlay.open{display:flex;}
  .lightbox{background:rgba(2,5,9,.9);}
  .lightbox .lb-inner{position:relative;max-width:92vw;max-height:88vh;display:flex;align-items:center;justify-content:center;}
  .lightbox img{max-width:92vw;max-height:88vh;object-fit:contain;border-radius:6px;}
  .lb-btn{
    position:fixed;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.12);color:#fff;border:none;
    width:44px;height:44px;border-radius:50%;font-size:1.3rem;cursor:pointer;
  }
  .lb-prev{left:16px;} .lb-next{right:16px;}
  .lb-close{position:fixed;top:16px;right:16px;background:rgba(255,255,255,.12);color:#fff;border:none;width:40px;height:40px;border-radius:50%;font-size:1.1rem;cursor:pointer;}
  .lb-count{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);color:#fff;font-family:var(--font-mono);font-size:.8rem;opacity:.8;}

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);
    padding:10px 18px;border-radius:999px;font-size:.85rem;box-shadow:var(--shadow-sm);z-index:100;
  }
  .toast.error{background:var(--danger);color:#fff;}

  .visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}

  @media (max-width:640px){
    .record-info-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div class="page">
  <div class="app-header">
    <span class="view-badge">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="12" r="3.2" stroke="currentColor" stroke-width="1.8"/></svg>
      โหมดดูอย่างเดียว
    </span>
    <div class="header-tools">
      <div class="conn-badge"><span class="conn-dot" id="conn-dot"></span><span id="conn-text">กำลังเชื่อมต่อ...</span></div>
      <div class="storage-meter" id="storage-meter">
        <span class="meter-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <ellipse cx="12" cy="5" rx="8" ry="3" stroke="currentColor" stroke-width="1.6"/>
            <path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5" stroke="currentColor" stroke-width="1.6"/>
            <path d="M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6" stroke="currentColor" stroke-width="1.6"/>
          </svg>
        </span>
        <div class="meter-body">
          <div class="label"><span>พื้นที่ (Firebase)</span><span class="num" id="storage-text">0 MB / ~1 GB</span></div>
          <div class="track"><div class="fill" id="storage-fill" style="width:0%"></div></div>
        </div>
      </div>
      <button class="tool-icon-btn" id="btn-export" title="ดาวน์โหลดข้อมูลเป็นไฟล์ JSON" aria-label="ดาวน์โหลดข้อมูล">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>

  <div class="hero">
    <div class="hero-graphic">
      <svg class="hero-truck" viewBox="0 0 340 190" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true">
        <defs>
          <linearGradient id="cabGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#5fb6f5"/>
            <stop offset="1" stop-color="#1f6fb8"/>
          </linearGradient>
          <linearGradient id="boxGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffffff"/>
            <stop offset=".6" stop-color="#eef1f5"/>
            <stop offset="1" stop-color="#d3d9df"/>
          </linearGradient>
          <linearGradient id="doorGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#e2e7ec"/>
            <stop offset="1" stop-color="#c3cad2"/>
          </linearGradient>
          <radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0" stop-color="#000000" stop-opacity=".4"/>
            <stop offset="1" stop-color="#000000" stop-opacity="0"/>
          </radialGradient>
        </defs>

        <!-- ground shadow -->
        <ellipse cx="180" cy="173" rx="152" ry="10" fill="url(#shadowGrad)"/>

        <!-- wheels -->
        <g>
          <circle cx="55" cy="155" r="19" fill="#12161c"/>
          <circle cx="55" cy="155" r="8" fill="#9aa3ad"/>
          <circle cx="250" cy="155" r="19" fill="#12161c"/>
          <circle cx="250" cy="155" r="8" fill="#9aa3ad"/>
          <circle cx="282" cy="155" r="19" fill="#12161c"/>
          <circle cx="282" cy="155" r="8" fill="#9aa3ad"/>
        </g>

        <!-- chassis frame -->
        <rect x="40" y="138" width="272" height="8" fill="#1c2430"/>

        <!-- container corner posts -->
        <rect x="106" y="44" width="7" height="94" fill="#8a95a3"/>
        <rect x="299" y="44" width="7" height="94" fill="#8a95a3"/>

        <!-- container box -->
        <rect x="113" y="44" width="186" height="94" fill="url(#boxGrad)" stroke="#b7bfc7"/>
        <rect x="113" y="44" width="186" height="5" fill="#ffffff" opacity=".7"/>

        <!-- corrugation ridges -->
        <g stroke="#c7ced6" stroke-width="1" opacity=".55">
          <line x1="126" y1="49" x2="126" y2="118"/>
          <line x1="139" y1="49" x2="139" y2="118"/>
          <line x1="152" y1="49" x2="152" y2="118"/>
          <line x1="165" y1="49" x2="165" y2="118"/>
          <line x1="178" y1="49" x2="178" y2="118"/>
          <line x1="191" y1="49" x2="191" y2="118"/>
          <line x1="204" y1="49" x2="204" y2="118"/>
          <line x1="217" y1="49" x2="217" y2="118"/>
          <line x1="230" y1="49" x2="230" y2="118"/>
          <line x1="243" y1="49" x2="243" y2="118"/>
          <line x1="256" y1="49" x2="256" y2="118"/>
          <line x1="269" y1="49" x2="269" y2="118"/>
          <line x1="282" y1="49" x2="282" y2="118"/>
        </g>

        <!-- rear doors -->
        <rect x="284" y="44" width="15" height="94" fill="url(#doorGrad)"/>
        <line x1="291.5" y1="46" x2="291.5" y2="136" stroke="#9aa3ad" stroke-width="1.4"/>
        <rect x="286" y="88" width="3" height="10" rx="1.5" fill="#5b6572"/>

<script>
(function(){
  "use strict";

  /* ---------------- Firebase (read-only usage on this page) ---------------- */
  var firebaseConfig = {
    apiKey: "AIzaSyDp8FdE_oCxHmi45dIGtXMALTicLeBm8KU",
    authDomain: "deliveryrecords-52e00.firebaseapp.com",
    projectId: "deliveryrecords-52e00",
    storageBucket: "deliveryrecords-52e00.firebasestorage.app",
    messagingSenderId: "297559986303",
    appId: "1:297559986303:web:dbcd68351121b1a162ef4a"
  };
  firebase.initializeApp(firebaseConfig);
  var db = firebase.firestore();

  var THAI_MONTHS = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
  var MAX_TOTAL_BYTES = 1024 * 1024 * 1024; // ~1GB Firestore free tier, informational only

  var ICON_TRUCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="margin-right:5px;flex:none;"><path d="M2 7h11v9H2z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M13 10h4l4 3v3h-8z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="6" cy="18" r="1.8" stroke="currentColor" stroke-width="1.6"/><circle cx="17" cy="18" r="1.8" stroke="currentColor" stroke-width="1.6"/></svg>';
  var ICON_CAL = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="margin-right:5px;flex:none;"><rect x="3" y="5" width="18" height="16" rx="3" stroke="currentColor" stroke-width="1.8"/><path d="M3 10h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
  var ICON_PERSON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="8" r="3.6" stroke="currentColor" stroke-width="1.8"/><path d="M4.5 19.5a7.5 7.5 0 0 1 15 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
  var ICON_PIN = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 21s7-6.1 7-11.5A7 7 0 0 0 5 9.5C5 14.9 12 21 12 21Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="9.5" r="2.4" stroke="currentColor" stroke-width="1.6"/></svg>';
  var ICON_ALL = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="3" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.8"/><rect x="14" y="3" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.8"/><rect x="3" y="14" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.8"/><rect x="14" y="14" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.8"/></svg>';
  var ICON_GLOBE = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M3 12h18" stroke="currentColor" stroke-width="1.8"/><path d="M12 3c2.6 2.7 4 6 4 9s-1.4 6.3-4 9c-2.6-2.7-4-6-4-9s1.4-6.3 4-9Z" stroke="currentColor" stroke-width="1.6"/></svg>';

  function groupAvatarIcon(name){
    var n = String(name||'').toLowerCase();
    if(n.indexOf('ต่างประเทศ') !== -1 || n.indexOf('ต่างชาติ') !== -1 || n.indexOf('foreign') !== -1 || n.indexOf('export') !== -1 || n.indexOf('international') !== -1) return ICON_GLOBE;
    return ICON_PERSON;
  }

  var COUNTRIES = [
    { code:'CN', name:'China', flag:'🇨🇳' },
    { code:'TW', name:'Taiwan', flag:'🇹🇼' },
    { code:'HK', name:'Hong Kong', flag:'🇭🇰' },
    { code:'JP', name:'Japan', flag:'🇯🇵' },
    { code:'KR', name:'South Korea', flag:'🇰🇷' },
    { code:'VN', name:'Vietnam', flag:'🇻🇳' },
    { code:'MM', name:'Myanmar', flag:'🇲🇲' },
    { code:'LA', name:'Laos', flag:'🇱🇦' },
    { code:'KH', name:'Cambodia', flag:'🇰🇭' },
    { code:'MY', name:'Malaysia', flag:'🇲🇾' },
    { code:'SG', name:'Singapore', flag:'🇸🇬' },
    { code:'ID', name:'Indonesia', flag:'🇮🇩' },
    { code:'PH', name:'Philippines', flag:'🇵🇭' },
    { code:'IN', name:'India', flag:'🇮🇳' },
    { code:'US', name:'United States', flag:'🇺🇸' },
    { code:'GB', name:'United Kingdom', flag:'🇬🇧' },
    { code:'AU', name:'Australia', flag:'🇦🇺' },
    { code:'OTHER', name:'Other', flag:'🌐' }
  ];
  function countryByCode(code){
    for(var i=0;i<COUNTRIES.length;i++){ if(COUNTRIES[i].code===code) return COUNTRIES[i]; }
    return null;
  }

  var STATE = { groups: [], records: [] };
  var filters = { group:'all', q:'', date:'', country:'' };
  var lightboxImages = [];
  var lightboxIndex = 0;

  function $(sel, root){ return (root||document).querySelector(sel); }
  function $all(sel, root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function normalize(s){ return String(s||'').toLowerCase().replace(/[\s\-\.]/g,''); }

  function formatThaiDate(iso){
    if(!iso) return '';
    var parts = iso.split('-');
    var y = Number(parts[0]), m = Number(parts[1]), d = Number(parts[2]);
    if(!y||!m||!d) return iso;
    return d + ' ' + THAI_MONTHS[m-1] + ' ' + (y+543);
  }

  function todayISO(){
    var d = new Date();
    var m = String(d.getMonth()+1).padStart(2,'0');
    var day = String(d.getDate()).padStart(2,'0');
    return d.getFullYear() + '-' + m + '-' + day;
  }

  function pad2(n){ return n < 10 ? '0' + n : '' + n; }
  function isoFromYMD(y,m,d){ return y + '-' + pad2(m) + '-' + pad2(d); }

  /* ---------------- connection status ---------------- */
  function setConnStatus(state, text){
    var dot = $('#conn-dot'); var t = $('#conn-text');
    dot.classList.remove('online','error');
    if(state) dot.classList.add(state);
    t.textContent = text;
  }

  /* ---------------- search-filter date popover calendar ---------------- */
  var calView = { y: 0, m: 0 };

  function getShipmentDateSet(){
    var s = {};
    STATE.records.forEach(function(r){ if(r.date) s[r.date] = true; });
    return s;
  }

  function renderCalendarGrid(){
    var y = calView.y, m = calView.m;
    $('#dp-label').textContent = THAI_MONTHS[m-1] + ' ' + (y + 543);
    var firstDow = new Date(y, m-1, 1).getDay();
    var daysInMonth = new Date(y, m, 0).getDate();
    var shipDates = getShipmentDateSet();
    var todayIso = todayISO();
    var html = '';
    for(var i=0;i<firstDow;i++){ html += '<button type="button" class="dp-day blank" tabindex="-1"></button>'; }
    for(var d=1; d<=daysInMonth; d++){
      var iso = isoFromYMD(y, m, d);
      var cls = 'dp-day';
      if(shipDates[iso]) cls += ' has-shipment';
      if(iso === todayIso) cls += ' today';
      if(iso === filters.date) cls += ' selected';
      html += '<button type="button" class="' + cls + '" data-iso="' + iso + '">' + d + '</button>';
    }
    $('#dp-grid').innerHTML = html;
  }

  function updateDateLabel(){
    $('#f-date-label').textContent = filters.date ? formatThaiDate(filters.date) : 'เลือกวันที่ส่งสินค้า';
  }

  function openDatePopover(){
    var base = filters.date ? filters.date.split('-') : null;
    var now = new Date();
    calView.y = base ? Number(base[0]) : now.getFullYear();
    calView.m = base ? Number(base[1]) : now.getMonth() + 1;
    renderCalendarGrid();
    $('#date-popover').classList.add('open');
    $('#f-date-btn').setAttribute('aria-expanded', 'true');
  }
  function closeDatePopover(){
    $('#date-popover').classList.remove('open');
    $('#f-date-btn').setAttribute('aria-expanded', 'false');
  }
  function toggleDatePopover(){
    if($('#date-popover').classList.contains('open')) closeDatePopover();
    else openDatePopover();
  }

  /* ---------------- toast ---------------- */
  var toastTimer = null;
  function showToast(msg, isError){
    var t = $('#toast');
    t.textContent = msg;
    t.className = 'toast' + (isError ? ' error' : '');
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.hidden = true; }, isError ? 4500 : 2200);
  }

  /* ---------------- storage meter (informational, Firestore ~1GB free tier) ---------------- */
  function refreshStorageMeter(){
    var bytes = new Blob([JSON.stringify(STATE)]).size;
    var mb = bytes / (1024*1024);
    var pct = Math.min(100, (bytes / MAX_TOTAL_BYTES) * 100);
    $('#storage-text').textContent = mb.toFixed(2) + ' MB / ~1 GB';
    $('#storage-fill').style.width = Math.max(pct, 1.2) + '%';
    var meter = $('#storage-meter');
    meter.classList.remove('warn','danger');
    if(pct > 85) meter.classList.add('danger');
    else if(pct > 60) meter.classList.add('warn');
  }

  /* ---------------- rendering ---------------- */
  function chipHtml(group){
    var hue = group ? group.hue % 6 : 0;
    return '<span class="badge-group" style="background:var(--chip-' + hue + ')">' + esc(group ? group.name : 'ไม่ระบุกลุ่ม') + '</span>';
  }

  function groupById(id){
    for(var i=0;i<STATE.groups.length;i++){ if(STATE.groups[i].id===id) return STATE.groups[i]; }
    return null;
  }

  function isForeignGroupId(id){
    var g = groupById(id);
    return !!g && String(g.name||'').trim().toLowerCase() === 'foreign';
  }

  function renderCountryTabs(){
    var wrap = $('#country-tabs');
    if(!isForeignGroupId(filters.group)){
      wrap.style.display = 'none';
      wrap.innerHTML = '';
      return;
    }
    wrap.style.display = 'flex';
    var counts = {};
    STATE.records.forEach(function(r){
      if(r.groupId === filters.group && r.country){ counts[r.country] = (counts[r.country]||0)+1; }
    });
    var html = '<button type="button" class="country-pill" data-country="" aria-pressed="' + (!filters.country) + '"><span class="flag">🌐</span><span>All</span></button>';
    COUNTRIES.forEach(function(c){
      html += '<button type="button" class="country-pill" data-country="' + c.code + '" aria-pressed="' + (filters.country===c.code) + '">' +
        '<span class="flag">' + c.flag + '</span><span>' + esc(c.name) + '</span><span class="cnt">' + (counts[c.code]||0) + '</span>' +
      '</button>';
    });
    wrap.innerHTML = html;
  }

  function renderGroupTabs(){
    var wrap = $('#group-tabs');
    var counts = {};
    STATE.records.forEach(function(r){ counts[r.groupId] = (counts[r.groupId]||0)+1; });

    var html = '<button type="button" class="group-pill" data-group="all" aria-pressed="' + (filters.group==='all') + '">' +
        '<span class="pill-avatar pill-avatar-all">' + ICON_ALL + '</span>' +
        '<span class="pill-text"><span class="pill-label">All</span><span class="pill-count">' + STATE.records.length + '</span></span>' +
      '</button>';
    STATE.groups.forEach(function(g){
      var hue = g.hue % 6;
      html += '<button type="button" class="group-pill" data-group="' + esc(g.id) + '" aria-pressed="' + (filters.group===g.id) + '">' +
        '<span class="pill-avatar" style="background:var(--chip-' + hue + ')">' + groupAvatarIcon(g.name) + '</span>' +
        '<span class="pill-text"><span class="pill-label">' + esc(g.name) + '</span><span class="pill-count">' + (counts[g.id]||0) + '</span></span>' +
      '</button>';
    });
    wrap.innerHTML = html;
  }

  function getFiltered(){
    return STATE.records.filter(function(r){
      if(filters.group !== 'all' && r.groupId !== filters.group) return false;
      if(filters.country && r.country !== filters.country) return false;
      if(filters.q){
        var needle = normalize(filters.q);
        var hay = normalize(r.name + ' ' + r.plate + ' ' + (r.address||'') + ' ' + (r.district||'') + ' ' + (r.province||''));
        if(hay.indexOf(needle) === -1) return false;
      }
      if(filters.date){
        if(r.date !== filters.date) return false;
      }
      return true;
    }).sort(function(a,b){
      if(a.date !== b.date) return a.date < b.date ? 1 : -1;
      return (b.createdAt||0) - (a.createdAt||0);
    });
  }

  function renderRecordCard(r){
    var group = groupById(r.groupId);
    var country = r.country ? countryByCode(r.country) : null;
    var imagesHtml = (r.images && r.images.length)
      ? '<div class="record-images">' + r.images.map(function(src,i){
          return '<img src="' + src + '" alt="" data-action="view-images" data-id="' + esc(r.id) + '" data-index="' + i + '">';
        }).join('') + '</div>'
      : '';
    var locSub = [r.district, r.province].filter(Boolean).join(' ');
    var addressText = r.address ? esc(r.address) : '<span class="muted">— ไม่ระบุ —</span>';
    return (
      '<div class="record" data-id="' + esc(r.id) + '">' +
        '<div class="record-top-row">' +
          '<div class="record-badges">' +
            chipHtml(group) +
            (country ? '<span class="badge-country">' + country.flag + ' ' + esc(country.name) + '</span>' : '') +
            (r.affiliation ? '<span class="badge-affiliation">' + esc(r.affiliation) + '</span>' : '') +
            '<span class="badge-plate">' + ICON_TRUCK + esc(r.plate) + '</span>' +
          '</div>' +
          '<div class="record-right">' +
            '<span class="badge-date">' + ICON_CAL + formatThaiDate(r.date) + '</span>' +
          '</div>' +
        '</div>' +
        '<div class="record-info-grid">' +
          '<div class="info-block">' +
            '<div class="info-label">ชื่อลูกค้า</div>' +
            '<div class="info-value">' + ICON_PERSON + '<span>' + esc(r.name) + '</span></div>' +
          '</div>' +
          '<div class="info-block">' +
            '<div class="info-label">สถานที่ส่ง</div>' +
            '<div class="info-value">' + ICON_PIN + '<span>' + addressText + (locSub ? '<span class="info-sub">' + esc(locSub) + '</span>' : '') + '</span></div>' +
          '</div>' +
        '</div>' +
        (r.note ? '<div class="record-note">' + esc(r.note) + '</div>' : '') +
        imagesHtml +
      '</div>'
    );
  }

  function render(){
    renderGroupTabs();
    renderCountryTabs();
    refreshStorageMeter();

    var list = getFiltered();
    var listEl = $('#record-list');
    var emptyEl = $('#empty-state');
    var emptyText = $('#empty-text');

    $('#result-count').textContent = 'พบ ' + list.length + ' รายการ';

    if(list.length === 0){
      listEl.innerHTML = '';
      emptyEl.style.display = '';
      emptyText.textContent = STATE.records.length === 0
        ? 'ยังไม่มีข้อมูลลูกค้า'
        : 'ไม่พบข้อมูลที่ตรงกับตัวกรอง ลองล้างตัวกรองดู';
    } else {
      emptyEl.style.display = 'none';
      listEl.innerHTML = list.map(renderRecordCard).join('');
    }
  }

  /* ---------------- Firestore realtime sync (read-only: no writes on this page) ---------------- */
  function initSync(){
    setConnStatus(null, 'กำลังเชื่อมต่อ...');

    db.collection('groups').onSnapshot(function(snap){
      setConnStatus('online', 'เชื่อมต่อแล้ว');
      STATE.groups = snap.docs.map(function(d){ return Object.assign({ id: d.id }, d.data()); });
      render();
    }, function(err){
      setConnStatus('error', 'เชื่อมต่อไม่สำเร็จ');
      showToast('เชื่อมต่อฐานข้อมูลกลุ่มไม่สำเร็จ: ' + err.message, true);
    });

    db.collection('records').onSnapshot(function(snap){
      setConnStatus('online', 'เชื่อมต่อแล้ว');
      STATE.records = snap.docs.map(function(d){ return Object.assign({ id: d.id }, d.data()); });
      render();
    }, function(err){
      setConnStatus('error', 'เชื่อมต่อไม่สำเร็จ');
      showToast('เชื่อมต่อฐานข้อมูลรายการไม่สำเร็จ: ' + err.message, true);
    });
  }

  /* ---------------- modal helpers (lightbox only on this page) ---------------- */
  function openModal(id){ $('#'+id).classList.add('open'); }
  function closeModal(id){ $('#'+id).classList.remove('open'); }

  /* ---------------- lightbox ---------------- */
  function openLightbox(images, index){
    if(!images || !images.length) return;
    lightboxImages = images; lightboxIndex = index || 0;
    renderLightbox();
    openModal('modal-lightbox');
  }
  function renderLightbox(){
    $('#lb-img').src = lightboxImages[lightboxIndex];
    $('#lb-count').textContent = (lightboxIndex+1) + ' / ' + lightboxImages.length;
    $('#lb-prev').style.display = lightboxImages.length > 1 ? '' : 'none';
    $('#lb-next').style.display = lightboxImages.length > 1 ? '' : 'none';
  }
  function lightboxStep(delta){
    lightboxIndex = (lightboxIndex + delta + lightboxImages.length) % lightboxImages.length;
    renderLightbox();
  }

  /* ---------------- download a copy (read-only convenience) ---------------- */
  function exportData(){
    var data = JSON.stringify(STATE, null, 2);
    var blob = new Blob([data], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'delivery-records-' + todayISO() + '.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    showToast('ดาวน์โหลดข้อมูลแล้ว');
  }

  /* ---------------- events ---------------- */
  function bindEvents(){
    $all('.modal-overlay').forEach(function(overlay){
      overlay.addEventListener('click', function(e){ if(e.target === overlay) overlay.classList.remove('open'); });
    });
    document.addEventListener('keydown', function(e){
      if(e.key !== 'Escape') return;
      if($('#modal-lightbox').classList.contains('open')) closeModal('modal-lightbox');
      else if($('#date-popover').classList.contains('open')) closeDatePopover();
    });

    $('#record-list').addEventListener('click', function(e){
      var imgEl = e.target.closest('[data-action="view-images"]');
      if(!imgEl) return;
      var r = STATE.records.find(function(x){ return x.id === imgEl.getAttribute('data-id'); });
      if(r && r.images && r.images.length) openLightbox(r.images, Number(imgEl.getAttribute('data-index'))||0);
    });

    $('#group-tabs').addEventListener('click', function(e){
      var pill = e.target.closest('.group-pill[data-group]');
      if(pill){
        var newGroup = pill.getAttribute('data-group');
        if(newGroup !== filters.group) filters.country = '';
        filters.group = newGroup;
        render();
      }
    });

    $('#country-tabs').addEventListener('click', function(e){
      var pill = e.target.closest('.country-pill[data-country]');
      if(!pill) return;
      filters.country = pill.getAttribute('data-country');
      render();
    });

    $('#f-search').addEventListener('input', function(e){ filters.q = e.target.value; render(); });

    $('#f-date-btn').addEventListener('click', function(e){ e.stopPropagation(); toggleDatePopover(); });
    $('#dp-prev').addEventListener('click', function(){
      calView.m--; if(calView.m < 1){ calView.m = 12; calView.y--; }
      renderCalendarGrid();
    });
    $('#dp-next').addEventListener('click', function(){
      calView.m++; if(calView.m > 12){ calView.m = 1; calView.y++; }
      renderCalendarGrid();
    });
    $('#dp-grid').addEventListener('click', function(e){
      var btn = e.target.closest('.dp-day:not(.blank)');
      if(!btn) return;
      filters.date = btn.getAttribute('data-iso');
      updateDateLabel();
      closeDatePopover();
      render();
    });
    $('#dp-clear-date').addEventListener('click', function(){
      filters.date = '';
      updateDateLabel();
      renderCalendarGrid();
      render();
    });
    document.addEventListener('click', function(e){
      if(!$('#date-popover').classList.contains('open')) return;
      if(e.target.closest('#date-popover') || e.target.closest('#f-date-btn')) return;
      closeDatePopover();
    });

    $('#btn-clear').addEventListener('click', function(){
      filters = { group:'all', q:'', date:'', country:'' };
      $('#f-search').value='';
      updateDateLabel();
      closeDatePopover();
      render();
    });

    $('#lb-close').addEventListener('click', function(){ closeModal('modal-lightbox'); });
    $('#lb-prev').addEventListener('click', function(){ lightboxStep(-1); });
    $('#lb-next').addEventListener('click', function(){ lightboxStep(1); });
    document.addEventListener('keydown', function(e){
      if(!$('#modal-lightbox').classList.contains('open')) return;
      if(e.key === 'ArrowLeft') lightboxStep(-1);
      else if(e.key === 'ArrowRight') lightboxStep(1);
    });

    $('#btn-export').addEventListener('click', exportData);
  }

  bindEvents();
  render();
  initSync();
})();
</script>
</body>
</html>
