<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>วงล้อบิงโก ความปลอดภัย พขร.</title>
<style>
  body { 
    display: flex; flex-direction: column; align-items: center; 
    font-family: 'Sarabun', sans-serif; background-color: #f4f6f9; margin-top: 20px; 
  }
  .wheel-container { 
    position: relative; width: 350px; height: 350px; margin-top: 10px;
  }
  canvas { 
    width: 100%; height: 100%; border-radius: 50%; 
    border: 5px solid #333; box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    transition: transform 4s cubic-bezier(0.25, 0.1, 0.25, 1); 
  }
  .pointer { 
    position: absolute; top: -20px; left: 50%; transform: translateX(-50%); 
    width: 0; height: 0; 
    border-left: 20px solid transparent; border-right: 20px solid transparent; 
    border-top: 40px solid #e74c3c; z-index: 10; 
    filter: drop-shadow(0 3px 3px rgba(0,0,0,0.3));
  }
  button { 
    margin-top: 30px; padding: 15px 50px; font-size: 22px; font-weight: bold; 
    cursor: pointer; background-color: #28a745; color: white; 
    border: none; border-radius: 50px; box-shadow: 0 4px 6px rgba(0,0,0,0.2); 
    transition: 0.2s; 
  }
  button:hover { background-color: #218838; }
  button:disabled { background-color: #6c757d; cursor: not-allowed; }
  #result { 
    margin-top: 15px; font-size: 24px; font-weight: bold; color: #0056b3; 
    min-height: 35px; text-align: center;
  }

  /* -------------------------------------
     ส่วนตั้งค่าหน้าต่างเด้ง (Pop-up Modal) 
     ------------------------------------- */
  .modal {
    display: none; /* ซ่อนไว้ก่อน */
    position: fixed; z-index: 100; left: 0; top: 0; 
    width: 100%; height: 100%; 
    background-color: rgba(0,0,0,0.85); /* พื้นหลังสีดำโปร่งแสง */
    align-items: center; justify-content: center;
  }
  .modal-content {
    background-color: white; padding: 40px; border-radius: 20px;
    text-align: center; width: 80%; max-width: 900px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    animation: popUp 0.5s ease-out; /* แอนิเมชันเด้ง */
  }
  @keyframes popUp {
    0% { transform: scale(0.5); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  .modal-content h1 { 
    font-size: 55px; margin-bottom: 20px; color: #e74c3c; 
    border-bottom: 3px dashed #ddd; padding-bottom: 10px;
  }
  .modal-content p { 
    font-size: 45px; color: #2c3e50; margin-bottom: 40px; font-weight: bold; line-height: 1.4;
  }
  .close-btn { 
    font-size: 26px; background-color: #0056b3; color: white; 
    padding: 15px 40px; border: none; border-radius: 10px; cursor: pointer; 
  }
  .close-btn:hover { background-color: #004494; }
</style>
</head>
<body>

  <h2>🎡 วงล้อสุ่มคำถาม ความปลอดภัย (Bingo)</h2>
  
  <div class="wheel-container">
    <div class="pointer"></div>
    <canvas id="wheelCanvas" width="500" height="500"></canvas>
  </div>
  
  <button id="spinBtn" onclick="spinWheel()">หมุนวงล้อ!</button>
  <div id="result">เตรียมตัวบิงโก!</div>

  <!-- หน้าต่างเด้งสำหรับแสดงคำถามตัวใหญ่ๆ -->
  <div id="questionModal" class="modal">
    <div class="modal-content">
      <h1 id="modalTopicTitle">หัวข้อ</h1>
      <p id="modalQuestionText">คำถามจะแสดงที่นี่</p>
      <button class="close-btn" onclick="closeModal()">ปิดหน้าต่าง (หมุนต่อ)</button>
    </div>
  </div>

<script>
  // ไฟล์เสียงเอฟเฟกต์
  const tickSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2073/2073-preview.mp3');
  const cheerSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3');

  // ชุดข้อมูล: หัวข้อ และ คำถามที่สัมพันธ์กัน
  const wheelData = [
    { topic: "หมวกนิรภัย", question: "การไม่ใส่หมวกนิรภัยในพื้นที่ปฏิบัติงาน มีความเสี่ยงต่ออันตรายอะไรบ้าง?" },
    { topic: "รองเท้าเซฟตี้", question: "รองเท้าเซฟตี้ ช่วยป้องกันอันตรายอะไรให้เราได้บ้างเวลาลงหน้างาน?" },
    { topic: "เช็คลมยาง", question: "ถ้ายางรถบรรทุกอ่อนเกินไป จะส่งผลเสียอย่างไรต่อการควบคุมรถ?" },
    { topic: "เดินรอบรถ", question: "การเดินตรวจรอบรถ (Walk Around Check) ก่อนออกเดินทาง ช่วยป้องกันปัญหาอะไรได้บ้าง?" },
    { topic: "คลุมผ้าใบ", question: "การคลุมผ้าใบไม่มิดชิด (โดยเฉพาะขากลับเส้นทางวังน้อย) เสี่ยงต่อการเกิดอุบัติเหตุอย่างไร?" },
    { topic: "เสื้อสะท้อนแสง", question: "ทำไมเราถึงต้องใส่เสื้อสะท้อนแสงเวลาลงจากรถในเวลากลางคืน?" },
    { topic: "เช็คเบรก", question: "ก่อนออกรถ มีวิธีเช็คระบบเบรกและลมเบรกเบื้องต้นอย่างไรบ้าง?" },
    { topic: "งดโทรศัพท์", question: "การเล่นโทรศัพท์ขณะขับรถ ทำให้การตอบสนองต่อเหตุฉุกเฉินช้าลงจริงหรือไม่? เพราะอะไร?" }
  ];

  const colors = [
    "#3498db", "#f1c40f", "#2ecc71", "#e67e22", 
    "#9b59b6", "#1abc9c", "#e74c3c", "#f39c12"
  ];
  
  const canvas = document.getElementById("wheelCanvas");
  const ctx = canvas.getContext("2d");
  const centerX = canvas.width / 2;
  const centerY = canvas.height / 2;
  const radius = centerX;
  const sliceAngle = 2 * Math.PI / wheelData.length;

  // วาดวงล้อ
  for (let i = 0; i < wheelData.length; i++) {
    ctx.beginPath();
    ctx.moveTo(centerX, centerY);
    ctx.arc(centerX, centerY, radius, i * sliceAngle, (i + 1) * sliceAngle);
    ctx.fillStyle = colors[i];
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = "#fff";
    ctx.stroke();

    ctx.save();
    ctx.translate(centerX, centerY);
    ctx.rotate(i * sliceAngle + sliceAngle / 2);
    ctx.textAlign = "right";
    ctx.fillStyle = "#fff";
    ctx.font = "bold 26px sans-serif";
    ctx.fillText(wheelData[i].topic, radius - 30, 10);
    ctx.restore();
  }

  let currentRotation = 0;
  let isSpinning = false;
  let tickInterval;

  function spinWheel() {
    if(isSpinning) return;
    isSpinning = true;
    
    document.getElementById("result").innerText = "กำลังหมุน...";
    const btn = document.getElementById("spinBtn");
    btn.disabled = true;

    // เล่นเสียงรัวๆ ระหว่างหมุน
    tickInterval = setInterval(() => {
      tickSound.currentTime = 0;
      tickSound.play();
    }, 150);

    const randomDegree = Math.floor(Math.random() * 360) + 1800; 
    currentRotation += randomDegree;
    canvas.style.transform = `rotate(${currentRotation}deg)`;
    
    // เมื่อวงล้อหยุด (4 วินาที)
    setTimeout(() => {
      clearInterval(tickInterval); // หยุดเสียงรัว
      cheerSound.play(); // เล่นเสียงปรบมือ

      const actualRotation = currentRotation % 360;
      const normalizedRotation = (360 - actualRotation) % 360; 
      const pointerAngle = (normalizedRotation + 270) % 360;
      const sliceIndex = Math.floor(pointerAngle / (360 / wheelData.length));
      
      const wonItem = wheelData[sliceIndex];
      
      // แสดงหน้าต่าง Pop-up คำถามตัวใหญ่
      document.getElementById("modalTopicTitle").innerText = `🎉 ${wonItem.topic} 🎉`;
      document.getElementById("modalQuestionText").innerText = wonItem.question;
      document.getElementById("questionModal").style.display = "flex";
      
      document.getElementById("result").innerText = `หมุนได้: ${wonItem.topic}`;
      btn.disabled = false;
      isSpinning = false;
    }, 4000);
  }

  // ฟังก์ชันปิดหน้าต่าง
  function closeModal() {
    document.getElementById("questionModal").style.display = "none";
  }
</script>
</body>
</html>
