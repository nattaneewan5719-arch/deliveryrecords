<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>วงล้อบิงโก ความปลอดภัย พขร.</title>
<style>
  body { 
    display: flex; flex-direction: column; align-items: center; 
    font-family: 'Sarabun', sans-serif; background-color: #f4f6f9; margin-top: 50px; 
  }
  .wheel-container { 
    position: relative; width: 350px; height: 350px; margin-top: 20px;
  }
  canvas { 
    width: 100%; height: 100%; border-radius: 50%; 
    border: 5px solid #333; box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    transition: transform 4s cubic-bezier(0.25, 0.1, 0.25, 1); 
  }
  .pointer { 
    position: absolute; top: -20px; left: 50%; transform: translateX(-50%); 
    width: 0; height: 0; 
    border-left: 20px solid transparent; border-right: 20px solid transparent; 
    border-top: 40px solid #e74c3c; z-index: 10; 
    filter: drop-shadow(0 3px 3px rgba(0,0,0,0.3));
  }
  button { 
    margin-top: 40px; padding: 15px 50px; font-size: 22px; font-weight: bold; 
    cursor: pointer; background-color: #28a745; color: white; 
    border: none; border-radius: 50px; box-shadow: 0 4px 6px rgba(0,0,0,0.2); 
    transition: 0.2s; 
  }
  button:hover { background-color: #218838; }
  button:active { transform: scale(0.95); }
  button:disabled { background-color: #6c757d; cursor: not-allowed; }
  #result { 
    margin-top: 25px; font-size: 28px; font-weight: bold; color: #0056b3; 
    min-height: 40px; text-align: center;
  }
</style>
</head>
<body>

  <h2>🎡 วงล้อสุ่มคำถาม ความปลอดภัย</h2>
  
  <div class="wheel-container">
    <div class="pointer"></div>
    <canvas id="wheelCanvas" width="500" height="500"></canvas>
  </div>
  
  <button id="spinBtn" onclick="spinWheel()">หมุนวงล้อ!</button>
  <div id="result">เตรียมตัวบิงโก!</div>

<script>
  // ดึงไฟล์เสียงเอฟเฟกต์ (สามารถเปลี่ยนลิงก์เป็นไฟล์ .mp3 ของตัวเองได้)
  const tickSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2073/2073-preview.mp3');
  const cheerSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3');

  const topics = [
    "หมวกนิรภัย", "รองเท้าเซฟตี้", "เช็คลมยาง", "เดินรอบรถ", 
    "คลุมผ้าใบ", "เสื้อสะท้อนแสง", "เช็คเบรก", "งดโทรศัพท์"
  ];
  const colors = [
    "#3498db", "#f1c40f", "#2ecc71", "#e67e22", 
    "#9b59b6", "#1abc9c", "#e74c3c", "#f39c12"
  ];
  
  const canvas = document.getElementById("wheelCanvas");
  const ctx = canvas.getContext("2d");
  const centerX = canvas.width / 2;
  const centerY = canvas.height / 2;
  const radius = centerX;
  const sliceAngle = 2 * Math.PI / topics.length;

  for (let i = 0; i < topics.length; i++) {
    ctx.beginPath();
    ctx.moveTo(centerX, centerY);
    ctx.arc(centerX, centerY, radius, i * sliceAngle, (i + 1) * sliceAngle);
    ctx.fillStyle = colors[i];
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = "#fff";
    ctx.stroke();

    ctx.save();
    ctx.translate(centerX, centerY);
    ctx.rotate(i * sliceAngle + sliceAngle / 2);
    ctx.textAlign = "right";
    ctx.fillStyle = "#fff";
    ctx.font = "bold 28px sans-serif";
    ctx.fillText(topics[i], radius - 30, 10);
    ctx.restore();
  }

  let currentRotation = 0;
  let isSpinning = false;
  let tickInterval;

  function spinWheel() {
    if(isSpinning) return;
    isSpinning = true;
    
    document.getElementById("result").innerText = "กำลังหมุน...";
    const btn = document.getElementById("spinBtn");
    btn.disabled = true;

    // เล่นเสียงรัวๆ ระหว่างหมุน
    tickInterval = setInterval(() => {
      tickSound.currentTime = 0;
      tickSound.play();
    }, 150);

    const randomDegree = Math.floor(Math.random() * 360) + 1800; 
    currentRotation += randomDegree;
    canvas.style.transform = `rotate(${currentRotation}deg)`;
    
    // เมื่อวงล้อหยุด (4 วินาที)
    setTimeout(() => {
      clearInterval(tickInterval); // หยุดเสียงรัว
      cheerSound.play(); // เล่นเสียงปรบมือ

      const actualRotation = currentRotation % 360;
      const normalizedRotation = (360 - actualRotation) % 360; 
      const pointerAngle = (normalizedRotation + 270) % 360;
      const sliceIndex = Math.floor(pointerAngle / (360 / topics.length));
      
      document.getElementById("result").innerText = `🎉 ตกที่: ${topics[sliceIndex]} 🎉`;
      btn.disabled = false;
      isSpinning = false;
    }, 4000);
  }
</script>
</body>
</html>
